<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>Bingo</title>
		<style>
			/* ホストのテーマ(ライト/ダーク)に追従する。既定はライト、dark は media query で上書き。 */
			:root {
				color-scheme: light dark;
			}
			body {
				font-family: system-ui, sans-serif;
				padding: 16px;
				background: #ffffff;
				color: #1a1a1a;
			}
			#board {
				display: inline-block;
			}
			#board > div {
				display: flex;
			}
			.cell {
				width: 44px;
				height: 44px;
				margin: 2px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 6px;
				background: #e2e8f0;
				color: #1e293b;
				font-weight: 600;
			}
			.cell.marked {
				background: #16a34a;
				color: #ffffff;
			}
			#latest {
				font-size: 2.5rem;
				font-weight: 700;
				margin: 8px 0;
				min-height: 2.5rem;
				color: inherit; /* 背景に合わせて文字色が変わる(白背景=濃色 / 黒背景=白) */
			}
			#status {
				min-height: 1.2em;
				color: inherit;
				opacity: 0.65;
			}
			button {
				padding: 8px 16px;
				font-size: 1rem;
				border-radius: 6px;
				cursor: pointer;
				background: #e2e8f0;
				color: #1e293b;
				border: 1px solid rgba(128, 128, 128, 0.35);
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #1a1a1a;
					color: #f5f5f5;
				}
				.cell {
					background: #334155;
					color: #f1f5f9;
				}
				button {
					background: #334155;
					color: #f1f5f9;
				}
			}
		</style>
	</head>
	<body>
		<div id="board"></div>
		<button id="draw">START</button>
		<div id="latest"></div>
		<div id="status"></div>
		<!--BUNDLE-->
	</body>
</html>
