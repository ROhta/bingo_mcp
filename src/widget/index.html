<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>Bingo</title>
		<style>
			/* ホストのテーマ(ライト/ダーク)に追従。色は変数に集約し、dark は :root の上書きのみで切替。 */
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--fg: #1a1a1a;
				--surface: #e2e8f0; /* セル・ボタンの地色 */
				--surface-fg: #1e293b;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1a1a1a;
					--fg: #f5f5f5;
					--surface: #334155;
					--surface-fg: #f1f5f9;
				}
			}
			body {
				font-family: system-ui, sans-serif;
				padding: 16px;
				background: var(--bg);
				color: var(--fg);
			}
			#board {
				display: inline-block;
			}
			#board > div {
				display: flex;
			}
			.cell,
			button {
				background: var(--surface);
				color: var(--surface-fg);
			}
			.cell {
				width: 44px;
				height: 44px;
				margin: 2px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 6px;
				font-weight: 600;
			}
			.cell.marked {
				background: #16a34a;
				color: #ffffff;
			}
			button {
				padding: 8px 16px;
				font-size: 1rem;
				border-radius: 6px;
				cursor: pointer;
				border: 1px solid rgba(128, 128, 128, 0.35);
			}
			#latest {
				font-size: 2.5rem;
				font-weight: 700;
				margin: 8px 0;
				min-height: 2.5rem;
				color: inherit; /* 背景に合わせて文字色が変わる(白背景=濃色 / 黒背景=白) */
			}
			#status {
				min-height: 1.2em;
				color: inherit;
				opacity: 0.65;
			}
		</style>
	</head>
	<body>
		<div id="board"></div>
		<button id="draw">START</button>
		<div id="latest"></div>
		<div id="status"></div>
		<!--BUNDLE-->
	</body>
</html>
